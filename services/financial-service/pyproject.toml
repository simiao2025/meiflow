[project]
name = "financial-service"
version = "0.1.0"
description = "Microserviço responsável pelo domínio financeiro do MEIFlow"
dependencies = [
    "fastapi",
    "uvicorn",
    "supabase",
    "python-dotenv",
    "pydantic",
    "sqlmodel",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
