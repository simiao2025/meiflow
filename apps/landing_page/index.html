<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Confirmado | MEIFlow</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #121212;
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(234, 179, 8, 0.05);
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h1 {
            color: #EAB308;
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        p {
            color: #A1A1AA;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            background-color: #EAB308;
            color: #050505;
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">✅</div>
        <h1>E-mail Confirmado!</h1>
        <p>Sua conta no MEIFlow foi ativada com sucesso. Você já pode fechar esta página e voltar para o aplicativo no seu celular.</p>
        
        <a href="mobile://auth/login" class="btn">Abrir Aplicativo MEIFlow</a>
    </div>

    <script>
        // Tenta redirecionar para o app automaticamente no celular
        setTimeout(() => {
            window.location.href = "mobile://auth/login";
        }, 1500);
    </script>
</body>
</html>
