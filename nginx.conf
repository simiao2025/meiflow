events {}

http {
    server {
        listen 80;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # CORS restrito para origens conhecidas
        location /api/v1/ {
            # Permite apenas origens específicas
            set $cors_origin "";
            if ($http_origin ~* "^https://app\.meiflow\.com\.br$") {
                set $cors_origin $http_origin;
            }
            if ($http_origin ~* "^http://localhost:(8081|3000)$") {
                set $cors_origin $http_origin;
            }

            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Internal-Key,X-Correlation-ID' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

            # Trata requisições OPTIONS (Preflight) do navegador
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Internal-Key,X-Correlation-ID';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Encaminhamento para os serviços baseados no path
            location /api/v1/financial/ {
                proxy_pass http://financial-service:8001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /api/v1/fiscal/ {
                proxy_pass http://fiscal-service:8002/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /api/v1/crm/ {
                proxy_pass http://crm-service:8003/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            location /api/v1/chat/ {
                proxy_pass http://ai-orchestrator:8000/api/v1/chat/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
            
            location /api/v1/assistant/ {
                proxy_pass http://ai-orchestrator:8000/api/v1/assistant/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }
}
