services:
  # Serviço de IA (FastAPI + LangGraph)
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    container_name: meiflow-ai-service
    ports:
      - "8000:8000"
    volumes:
      - ./services/ai-service:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - meiflow-network

  # Redis para cache e memória de curto prazo da IA
  redis:
    image: redis:7-alpine
    container_name: meiflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - meiflow-network

networks:
  meiflow-network:
    driver: bridge

volumes:
  redis_data:
