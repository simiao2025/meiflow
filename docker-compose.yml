services:
  # Nginx - API Gateway & Load Balancer
  gateway:
    image: nginx:alpine
    container_name: meiflow-gateway
    ports:
      - "80:80"       # Entrada unificada
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - financial-service
      - fiscal-service
      - crm-service
      - ai-orchestrator
    networks:
      - meiflow-network

  # Orquestrador de IA
  ai-orchestrator:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=ai-orchestrator
    container_name: meiflow-ai-orchestrator
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FINANCIAL_SERVICE_URL=http://financial-service:8001
      - FISCAL_SERVICE_URL=http://fiscal-service:8002
      - CRM_SERVICE_URL=http://crm-service:8003
      - INTERNAL_API_KEY=meiflow_secret_2026_internal
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - meiflow-network

  financial-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=financial-service
    container_name: meiflow-financial-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - ./services/financial-service:/app
      - ./services/shared:/app/shared
    env_file:
      - .env
    networks:
      - meiflow-network

  fiscal-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=fiscal-service
    container_name: meiflow-fiscal-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    volumes:
      - ./services/fiscal-service:/app
      - ./services/shared:/app/shared
    env_file:
      - .env
    networks:
      - meiflow-network

  crm-service:
    build:
      context: ./services
      dockerfile: Dockerfile
      args:
        - SERVICE_NAME=crm-service
    container_name: meiflow-crm-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    volumes:
      - ./services/crm-service:/app
      - ./services/shared:/app/shared
    env_file:
      - .env
    networks:
      - meiflow-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: meiflow-redis
    networks:
      - meiflow-network

networks:
  meiflow-network:
    driver: bridge

volumes:
  redis_data:
